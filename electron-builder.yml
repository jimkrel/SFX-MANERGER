appId: com.sfxmusicmanager.app
productName: SFX Music Manager
directories:
  output: release
mac:
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.utilities
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SFX Music Manager
files:
  - "dist/**/*"
  - "build/**/*"
  - "package.json"
