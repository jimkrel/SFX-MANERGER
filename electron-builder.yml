appId: com.sfxmusicmanager.app
productName: SFX Music Manager
directories:
  output: release
  buildResources: build
mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.utilities
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
files:
  - "dist/**/*"
  - "package.json"
