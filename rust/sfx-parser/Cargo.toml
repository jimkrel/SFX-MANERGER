[package]
name = "sfx-parser"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# Symphonia — audio decoder dùng bởi Spotify
symphonia = { version = "0.5", features = [
  "mp3",
  "wav",
  "ogg",
  "flac",
  "aac",
  "isomp4",
  "all-codecs"
] }

[profile.release]
# Tối ưu size WASM
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
# Disable wasm-opt vì bundled version không support bulk-memory instructions
wasm-opt = false
