name: Tauri migration checks
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install yt-dlp==2026.11.23
      - if: runner.os == 'Windows'
        shell: pwsh
        run: if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
      - if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - run: npm ci --ignore-scripts
      - run: npm run test:tauri:phase12
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml --bin sfx-music-manager
      - run: npm run bench:tauri:phase11
